    <rect width="300" height="430" rx="22" fill="#F9F8F1" stroke="#FFFFFF" stroke-width="5"/>
    <rect x="27" y="28" width="246" height="310" rx="10" fill="#477B71"/>
  </g>
  <g transform="translate(625 205) rotate(17 150 220)" filter="url(#shadow)">
    <rect width="300" height="430" rx="22" fill="#FBFAF4" stroke="#FFFFFF" stroke-width="5"/>
    <rect x="28" y="30" width="244" height="312" rx="10" fill="url(#photo)"/>
    <circle cx="220" cy="100" r="34" fill="#FFF8D0" opacity="0.95"/>
    <path d="M28 295L92 218L145 260L198 190L272 285V342H28Z" fill="#455B55" opacity="0.92"/>
  </g>

  <g filter="url(#shadow)">
    <path d="M250 360C250 320 282 288 322 288H414L446 250H565L596 288H706C746 288 778 320 778 360V704C778 744 746 776 706 776H322C282 776 250 744 250 704V360Z" fill="url(#body)" stroke="#FFFDF3" stroke-width="7"/>
    <rect x="392" y="245" width="118" height="45" rx="16" fill="#202A2A"/>
    <circle cx="320" cy="365" r="31" fill="#263331" stroke="#D8D8C8" stroke-width="5"/>
    <circle cx="540" cy="555" r="190" fill="#F8F4E9" stroke="#FFFFFF" stroke-width="7"/>
    <circle cx="540" cy="555" r="162" fill="#142A2A"/>
    <circle cx="540" cy="555" r="143" fill="url(#lens)" stroke="#071E20" stroke-width="8"/>
    <circle cx="540" cy="555" r="108" fill="#083F45" opacity="0.72" stroke="#18B7A9" stroke-width="5"/>
    <circle cx="540" cy="555" r="74" fill="#06373F" opacity="0.8"/>
    <circle cx="604" cy="493" r="35" fill="#FFF7A4" opacity="0.9"/>
    <circle cx="577" cy="518" r="14" fill="#DFFFF0" opacity="0.85"/>
  </g>

  <rect x="74" y="74" width="876" height="876" rx="184" stroke="#063B2D" stroke-width="6" opacity="0.55"/>
</svg>
