name: sprout
description: Sprout — share and relive memories with your circles.
publish_to: none
version: 2.0.0+13

environment:
  sdk: ^3.9.0

dependencies:
  firebase_core: ^4.2.0
  firebase_auth: ^6.1.0
  cloud_firestore: ^6.0.0
  flutter:
    sdk: flutter
  sizer: ^2.0.15
  flutter_svg: ^2.0.9
  google_fonts: ^6.1.0
  shared_preferences: ^2.2.2
  web: ^1.1.1
  cached_network_image: ^3.3.1
  connectivity_plus: ^6.1.4
  dio: ^5.4.0
  fluttertoast: ^8.2.4
  fl_chart: ^0.65.0
  go_router: ^14.6.1
  image_picker: ^1.1.2
  supabase_flutter: ^2.8.0
  geolocator: ^14.0.3
  geocoding: ^5.0.0
  share_plus: ^10.1.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/
    - assets/images/
