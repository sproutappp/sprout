<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Join a Circle on Sprout</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background: #0A0F0D;
      color: #F5F5F0;
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      text-align: center;
      padding: 24px;
    }
    .card { max-width: 360px; }
    h1 { font-size: 22px; margin-bottom: 8px; }
    p { color: #9AA39C; font-size: 14px; line-height: 1.5; margin-bottom: 24px; }
    a.button {
      display: inline-block;
      background: #39FF8C;
      color: #0A0F0D;
      font-weight: 700;
      padding: 14px 28px;
      border-radius: 14px;
      text-decoration: none;
      font-size: 15px;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>You've been invited to a Circle 🌿</h1>
    <p>
      Install Sprout to join — once it's installed, come back and tap
      this link again to join automatically.
    </p>
    <a class="button" href="https://play.google.com/store/apps/details?id=com.sprout.app">
      Get Sprout on Google Play
    </a>
  </div>
</body>
</html>
