name: Fix memory card key constructors

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-memory-card-keys.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Add widget keys to constructors
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'target not found in {path}: {old!r}')
              if text.count(old) != 1:
                  raise SystemExit(f'target occurs {text.count(old)} times in {path}: {old!r}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'lib/presentation/circle_detail_screen/circle_detail_screen.dart',
              '  const _MemoryRow({required this.memory, required this.onTap});',
              '  const _MemoryRow({super.key, required this.memory, required this.onTap});',
          )

          replace_once(
              'lib/presentation/memories_screen/widgets/memories_grid_widget.dart',
              '  const _MemoryHorizontalCard({\n    required this.memory,',
              '  const _MemoryHorizontalCard({\n    super.key,\n    required this.memory,',
          )

          replace_once(
              'lib/presentation/home_screen/widgets/home_recent_memories_widget.dart',
              '  const _MemoryCardWidget({\n    required this.memory,',
              '  const _MemoryCardWidget({\n    super.key,\n    required this.memory,',
          )
          PY

      - name: Validate Dart constructors
        shell: bash
        run: |
          grep -q 'const _MemoryRow({super.key, required this.memory, required this.onTap});' lib/presentation/circle_detail_screen/circle_detail_screen.dart
          grep -A2 -q 'const _MemoryHorizontalCard({' lib/presentation/memories_screen/widgets/memories_grid_widget.dart
          grep -A2 -q 'const _MemoryCardWidget({' lib/presentation/home_screen/widgets/home_recent_memories_widget.dart

      - name: Commit source fixes and remove this workflow
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/presentation/circle_detail_screen/circle_detail_screen.dart lib/presentation/memories_screen/widgets/memories_grid_widget.dart lib/presentation/home_screen/widgets/home_recent_memories_widget.dart
          git commit -m "Fix memory card key constructors"
          git rm .github/workflows/fix-memory-card-keys.yml
          git commit -m "Remove one-time memory key workflow"
          git push
