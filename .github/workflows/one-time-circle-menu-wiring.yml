name: One-time circle menu wiring
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, '[circle-menus-wired]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire circle menus
        run: |
          python3 <<'PY'
          from pathlib import Path

          p = Path('lib/presentation/home_screen/widgets/home_circles_strip_widget.dart')
          s = p.read_text()
          if "import '../../../widgets/circle_action_menu.dart';" not in s:
              s = s.replace("import '../../../services/circles_repository.dart';", "import '../../../services/circles_repository.dart';\nimport '../../../widgets/circle_action_menu.dart';", 1)
          if 'final Circle sourceCircle;' not in s:
              s = s.replace('  final Color color;\n', '  final Color color;\n  final Circle sourceCircle;\n', 1)
              s = s.replace('    required this.color,\n', '    required this.color,\n    required this.sourceCircle,\n', 1)
              s = s.replace('    name: circle.name,\n', '    name: circle.name,\n    sourceCircle: circle,\n', 1)
          if 'CircleActionMenu(' not in s:
              old = '''            // Chevron
            Icon(
              Icons.chevron_right_rounded,
              size: 18,
              color: AppTheme.textDisabled,
            ),'''
              new = '''            CircleActionMenu(
              circle: c.sourceCircle,
              onChanged: _load,
            ),'''
              if old not in s: raise SystemExit('Home chevron marker not found')
              s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('lib/presentation/circles_screen/circles_screen_with_cover.dart')
          s = p.read_text()
          if "import '../../widgets/circle_action_menu.dart';" not in s:
              s = s.replace("import '../../theme/app_theme.dart';", "import '../../theme/app_theme.dart';\nimport '../../widgets/circle_action_menu.dart';", 1)
          if 'final VoidCallback? onChanged;' not in s:
              s = s.replace('  final VoidCallback onTap;\n', '  final VoidCallback onTap;\n  final VoidCallback? onChanged;\n', 1)
              s = s.replace('    required this.onTap,\n  });', '    required this.onTap,\n    this.onChanged,\n  });', 1)
              s = s.replace('''                          onTap: () => _openCircleDetail(circle),
                        ),''', '''                          onTap: () => _openCircleDetail(circle),
                          onChanged: _loadCircles,
                        ),''', 1)
          if 'CircleActionMenu(' not in s:
              old = '''            const SizedBox(width: 8),
            const Icon(
              Icons.chevron_right_rounded,
              size: 20,
              color: AppTheme.textDisabled,
            ),'''
              new = '''            const SizedBox(width: 4),
            CircleActionMenu(
              circle: circle,
              onChanged: onChanged,
            ),'''
              if old not in s: raise SystemExit('Circles chevron marker not found')
              s = s.replace(old, new, 1)
          p.write_text(s)

          p = Path('lib/presentation/profile_screen/profile_screen.dart')
          s = p.read_text()
          if "import '../../widgets/circle_action_menu.dart';" not in s:
              s = s.replace("import '../../services/memories_repository.dart';", "import '../../services/memories_repository.dart';\nimport '../../widgets/circle_action_menu.dart';", 1)
          if 'final Circle sourceCircle;' not in s:
              s = s.replace('  final Color accent;\n', '  final Color accent;\n  final Circle sourceCircle;\n', 1)
              s = s.replace('    required this.accent,\n', '    required this.accent,\n    required this.sourceCircle,\n', 1)
              s = s.replace('    id: c.id,\n    name: c.name,\n', '    id: c.id,\n    name: c.name,\n    sourceCircle: c,\n', 1)
          if 'CircleActionMenu(' not in s:
              old = '''          Icon(
            Icons.chevron_right_rounded,
            color: AppTheme.textMuted,
            size: 18,
          ),'''
              new = '''          CircleActionMenu(
            circle: circle.sourceCircle,
            onChanged: _load,
          ),'''
              if old not in s: raise SystemExit('Profile chevron marker not found')
              s = s.replace(old, new, 1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add lib/presentation/home_screen/widgets/home_circles_strip_widget.dart lib/presentation/circles_screen/circles_screen_with_cover.dart lib/presentation/profile_screen/profile_screen.dart
          if git diff --cached --quiet; then echo 'No source changes needed'; exit 0; fi
          git commit -m 'Wire circle menus [circle-menus-wired]'
          git push
