name: Patch Profile Settings

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch settings navigation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('lib/presentation/profile_screen/profile_screen.dart')
          s = p.read_text()
          old = """    } else if (action.label == 'Privacy') {\n      context.push(AppRoutes.privacyPolicyScreen);\n    }\n    // 'Settings' has no route yet in AppRoutes — left as a no-op like\n    // before, rather than inventing a screen that wasn't asked for.\n"""
          new = """    } else if (action.label == 'Privacy') {\n      context.push(AppRoutes.privacyPolicyScreen);\n    } else if (action.label == 'Settings') {\n      context.push(AppRoutes.settingsScreen);\n    }\n"""
          if old not in s:
              raise SystemExit('Expected Settings block not found; refusing to modify the file.')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit and remove patch workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          rm -f .github/workflows/patch-profile-settings.yml
          git add lib/presentation/profile_screen/profile_screen.dart .github/workflows/patch-profile-settings.yml
          git commit -m 'Wire Profile Settings action'
          git push
