name: Repair memory sources

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/repair-memory-sources.yml'
  workflow_dispatch:

jobs:
  repair:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply narrowly scoped repairs
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'target not found in {path}: {old[:80]!r}')
              if text.count(old) != 1:
                  raise SystemExit(f'target occurs {text.count(old)} times in {path}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'lib/presentation/home_screen/widgets/home_recent_memories_widget.dart',
              "      circle: m.circleName ?? 'Circle',\n      circleColor: _palette[index % _palette.length],\n      // All memories are circle-scoped for now — there's no \"public\"\n      // sharing concept in the schema yet.\n      privacy: MemoryPrivacy.circle,",
              "      circle: m.isPublic ? 'Public' : (m.circleName ?? 'Circle'),\n      circleColor: _palette[index % _palette.length],\n      privacy: m.isPublic ? MemoryPrivacy.public : MemoryPrivacy.circle,",
          )

          replace_once(
              'lib/presentation/home_screen/widgets/home_discover_teaser_widget.dart',
              "import '../../../services/circles_repository.dart';\n",
              '',
          )

          p = Path('lib/presentation/home_screen/widgets/home_discover_teaser_widget.dart')
          text = p.read_text()
          start = text.index('  Future<void> _load() async {')
          end = text.index('\n  @override\n  Widget build', start)
          new_load = '''  Future<void> _load() async {
    try {
      final memories = await MemoriesRepository.fetchPublicMemories();
      final experiences = [
        for (final m in memories.take(2))
          _ExperiencePreview(
            circleId: m.id,
            circleName: m.caption?.isNotEmpty == true
                ? m.caption!
                : 'Public Memory',
            coverImageUrl: m.imageUrl,
            memoryCount: 1,
          ),
      ];
      if (!mounted) return;
      setState(() {
        _experiences = experiences;
        _isLoading = false;
      });
    } catch (_) {
      if (!mounted) return;
      setState(() => _isLoading = false);
    }
  }
'''
          p.write_text(text[:start] + new_load + text[end:])

          replace_once(
              'lib/services/memories_repository.dart',
              "  static Future<List<Memory>> fetchByUploader(String uploaderId) async {\n    final rows = await _client.from('memories').select('*, profiles(id, full_name, avatar_url), circles(id, name)').eq('uploaded_by', uploaderId).order('created_at', ascending: false);\n    return _toMemoriesWithSignedUrls(rows as List);\n  }",
              """  static Future<List<Memory>> fetchByUploader(String uploaderId) async {
    if (_client.auth.currentUser?.id == uploaderId) {
      return fetchAllForUser();
    }
    final rows = await _client
        .from('memories')
        .select('id, circle_id, uploaded_by, image_url, caption, location, created_at, is_public')
        .eq('uploaded_by', uploaderId)
        .order('created_at', ascending: false);
    return _toMemoriesWithSignedUrls(rows as List);
  }""",
          )
          PY

      - name: Validate targeted changes
        shell: bash
        run: |
          grep -q "m.isPublic ? 'Public'" lib/presentation/home_screen/widgets/home_recent_memories_widget.dart
          grep -q "fetchPublicMemories" lib/presentation/home_screen/widgets/home_discover_teaser_widget.dart
          grep -q "return fetchAllForUser();" lib/services/memories_repository.dart

      - name: Commit changes and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/presentation/home_screen/widgets/home_recent_memories_widget.dart lib/presentation/home_screen/widgets/home_discover_teaser_widget.dart lib/services/memories_repository.dart
          git diff --cached --quiet || git commit -m "Repair public and circle memory sources"
          git rm .github/workflows/repair-memory-sources.yml
          git commit -m "Remove one-time memory repair workflow"
          git push
