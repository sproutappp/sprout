name: One-time circle header share patch

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Patch circle header share button
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/presentation/circle_detail_screen/circle_detail_screen.dart')
          text = path.read_text()

          share_import = "import 'package:share_plus/share_plus.dart';"
          if share_import not in text:
              marker = "import 'package:image_picker/image_picker.dart';"
              if marker not in text:
                  raise SystemExit('image_picker import not found')
              text = text.replace(marker, marker + "\n" + share_import, 1)

          if 'Future<void> _shareCircle(Circle circle) async' not in text:
              anchor = """  void _openInviteSheet(Circle circle) {\n    showModalBottomSheet<void>(\n      context: context,\n      isScrollControlled: true,\n      backgroundColor: Colors.transparent,\n      builder: (_) => _InviteSheet(circle: circle),\n    );\n  }\n"""
              method = """  void _openInviteSheet(Circle circle) {\n    showModalBottomSheet<void>(\n      context: context,\n      isScrollControlled: true,\n      backgroundColor: Colors.transparent,\n      builder: (_) => _InviteSheet(circle: circle),\n    );\n  }\n\n  Future<void> _shareCircle(Circle circle) async {\n    try {\n      final token = await CirclesRepository.createInvite(circle.id);\n      final link = 'https://sproutapp.in/join/$token';\n      await SharePlus.instance.share(\n        ShareParams(\n          title: 'Join ${circle.name} on Sprout',\n          text: 'Join my circle "${circle.name}" on Sprout:\\n$link',\n        ),\n      );\n    } catch (e, st) {\n      debugPrint('CircleDetailScreen: share circle failed: $e\\n$st');\n      if (!mounted) return;\n      ScaffoldMessenger.of(context).showSnackBar(\n        SnackBar(\n          content: Text(\n            \"Couldn't share this circle. Please try again.\",\n            style: GoogleFonts.manrope(color: Colors.white),\n          ),\n          backgroundColor: AppTheme.error,\n        ),\n      );\n    }\n  }\n"""
              if anchor not in text:
                  raise SystemExit('invite sheet method anchor not found')
              text = text.replace(anchor, method, 1)

          old_callback = "onInvite: () => _openInviteSheet(circle),"
          new_callback = "onShare: () => _shareCircle(circle),"
          if old_callback in text:
              text = text.replace(old_callback, new_callback, 1)
          elif new_callback not in text:
              raise SystemExit('header callback not found')

          text = text.replace('final VoidCallback onInvite;', 'final VoidCallback onShare;', 1)
          text = text.replace('required this.onInvite,', 'required this.onShare,', 1)

          old_button = """                GestureDetector(\n                  onTap: onInvite,\n                  child: Container(\n                    padding: const EdgeInsets.symmetric(horizontal: 12, vertical: 9),\n                    decoration: BoxDecoration(\n                      color: AppTheme.primaryGreen,\n                      borderRadius: BorderRadius.circular(16),\n                    ),\n                    child: Row(\n                      mainAxisSize: MainAxisSize.min,\n                      children: [\n                        const Icon(Icons.person_add_alt_1_rounded, size: 14, color: Colors.black),\n                        const SizedBox(width: 5),\n                        Text(\n                          'Invite',\n                          style: GoogleFonts.manrope(\n                            color: Colors.black,\n                            fontSize: 11,\n                            fontWeight: FontWeight.w800,\n                          ),\n                        ),\n                      ],\n                    ),\n                  ),\n                ),"""
          new_button = """                GestureDetector(\n                  onTap: onShare,\n                  child: Container(\n                    width: 42,\n                    height: 42,\n                    decoration: BoxDecoration(\n                      color: AppTheme.primaryGreen,\n                      shape: BoxShape.circle,\n                    ),\n                    child: const Icon(\n                      Icons.share_rounded,\n                      size: 20,\n                      color: Colors.black,\n                    ),\n                  ),\n                ),"""
          if old_button in text:
              text = text.replace(old_button, new_button, 1)
          elif 'onTap: onShare,' not in text:
              raise SystemExit('header invite button block not found')

          path.write_text(text)
          PY

      - name: Validate patched Dart file
        run: |
          set -euo pipefail
          flutter pub get
          dart format --output=none --set-exit-if-changed lib/presentation/circle_detail_screen/circle_detail_screen.dart

      - name: Commit patched app and remove temporary workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/one-time-circle-share.yml
          git add lib/presentation/circle_detail_screen/circle_detail_screen.dart .github/workflows/one-time-circle-share.yml
          git diff --cached --quiet && exit 0
          git commit -m "Replace circle header invite with native share"
          git push

      - name: Trigger Build APK workflow
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run build-apk.yml --ref main
