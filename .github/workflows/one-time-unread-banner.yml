name: One-time unread memory banner patch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Patch banner navigation
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/presentation/circles_screen/circles_screen_with_cover.dart')
          text = path.read_text()

          if "import '../../services/memories_repository.dart';" not in text:
              text = text.replace(
                  "import '../../services/notifications_repository.dart';",
                  "import '../../services/notifications_repository.dart';\nimport '../../services/memories_repository.dart';\nimport '../../presentation/memories_screen/widgets/memories_grid_widget.dart';",
                  1,
              )

          if 'Future<void> _openUnreadMemories() async' not in text:
              anchor = "  void _openCircleDetail(Circle circle) {\n    context.push(AppRoutes.circleDetailScreen, extra: circle.id);\n  }\n"
              method = anchor + """

  Future<void> _openUnreadMemories() async {
    if (_unreadMemoryCount > 1) {
      if (mounted) context.push(AppRoutes.notificationsScreen);
      return;
    }

    try {
      final notifications = await NotificationsRepository.fetchForUser();
      final unread = notifications
          .where((n) => n.type == AppNotificationType.circleMemory && !n.isRead && n.memoryId != null)
          .toList()
        ..sort((a, b) => b.createdAt.compareTo(a.createdAt));

      if (!mounted) return;
      if (unread.length != 1 || unread.first.memoryId == null) {
        context.push(AppRoutes.notificationsScreen);
        return;
      }

      final memory = await MemoriesRepository.fetchById(unread.first.memoryId!);
      if (!mounted) return;
      if (memory == null) {
        context.push(AppRoutes.notificationsScreen);
        return;
      }

      await NotificationsRepository.markAsRead(unread.first.id);
      if (!mounted) return;

      final item = MemoryItem(
        id: memory.id,
        title: memory.caption?.isNotEmpty == true ? memory.caption! : 'A shared memory',
        date: '${memory.createdAt.day}/${memory.createdAt.month}/${memory.createdAt.year}',
        imageUrl: memory.imageUrl,
        semanticLabel: 'Shared memory photo',
        circle: memory.circleName ?? 'Circle',
        circleColor: AppTheme.primaryGreen,
        privacy: MemoryPrivacy.circle,
        type: MemoryType.photo,
      );
      context.push(AppRoutes.memoryDetailScreen, extra: item);
    } catch (e, st) {
      debugPrint('CirclesScreen: open unread memory failed: $e\\n$st');
      if (mounted) context.push(AppRoutes.notificationsScreen);
    }
  }
"""
              if anchor not in text:
                  raise SystemExit('circle detail anchor not found')
              text = text.replace(anchor, method, 1)

          old_call = "                    child: _UnreadBanner(count: _unreadMemoryCount),"
          new_call = "                    child: _UnreadBanner(\n                      count: _unreadMemoryCount,\n                      onTap: _openUnreadMemories,\n                    ),"
          if old_call in text:
              text = text.replace(old_call, new_call, 1)

          old_class = "class _UnreadBanner extends StatelessWidget {\n  final int count;\n  const _UnreadBanner({required this.count});"
          new_class = "class _UnreadBanner extends StatelessWidget {\n  final int count;\n  final VoidCallback onTap;\n  const _UnreadBanner({required this.count, required this.onTap});"
          if old_class in text:
              text = text.replace(old_class, new_class, 1)

          banner_marker = 'class _UnreadBanner extends StatelessWidget {'
          before, banner = text.split(banner_marker, 1)
          old_build = "  Widget build(BuildContext context) {\n    return Container("
          new_build = "  Widget build(BuildContext context) {\n    return GestureDetector(\n      onTap: onTap,\n      child: Container("
          if old_build in banner:
              banner = banner.replace(old_build, new_build, 1)
          text = before + banner_marker + banner

          path.write_text(text)
          PY

      - name: Validate
        run: |
          grep -q "Future<void> _openUnreadMemories() async" lib/presentation/circles_screen/circles_screen_with_cover.dart
          grep -q "onTap: _openUnreadMemories" lib/presentation/circles_screen/circles_screen_with_cover.dart

      - name: Commit and remove patch workflow
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-time-unread-banner.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/presentation/circles_screen/circles_screen_with_cover.dart .github/workflows/one-time-unread-banner.yml
          git commit -m "Fix unread memory banner navigation"
          git push
