name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}

    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Apply focused memory deletion and title fix
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          p = Path('lib/presentation/memories_screen/memories_screen.dart')
          text = p.read_text()
          if 'void _removeDeletedMemory(String memoryId)' not in text:
              anchor = '  Future<void> _load() async {\n'
              method = '''  void _removeDeletedMemory(String memoryId) {
    if (!mounted) return;
    setState(() {
      _allMemories = _allMemories.where((memory) => memory.id != memoryId).toList();
    });
  }

  Future<void> _load() async {
'''
              if anchor not in text: raise SystemExit('MemoriesScreen load anchor not found')
              text = text.replace(anchor, method, 1)
          if "title: m.caption?.isNotEmpty == true ? m.caption! : 'A memory'," in text:
              text = text.replace("title: m.caption?.isNotEmpty == true ? m.caption! : 'A memory',", 'title: memoryDisplayTitle(m.caption),', 1)
          if 'onDeleted: _removeDeletedMemory' not in text:
              old = 'child: MemoriesGridWidget(memories: filtered),'
              new = '''child: MemoriesGridWidget(
                      memories: filtered,
                      onDeleted: _removeDeletedMemory,
                    ),'''
              if old not in text: raise SystemExit('MemoriesGridWidget call not found')
              text = text.replace(old, new, 1)
          p.write_text(text)

          p = Path('lib/presentation/memories_screen/widgets/memories_grid_widget.dart')
          text = p.read_text()
          if 'String memoryDisplayTitle(String? caption)' not in text:
              marker = 'enum MemoryType { photo }\n'
              helper = '''enum MemoryType { photo }

String memoryDisplayTitle(String? caption) {
  final value = (caption ?? '').trim();
  if (value.isEmpty) return 'A memory';
  final separator = value.indexOf(' — ');
  return separator > 0 ? value.substring(0, separator).trim() : value;
}
'''
              if marker not in text: raise SystemExit('MemoryType marker not found')
              text = text.replace(marker, helper, 1)
          if 'final ValueChanged<String>? onDeleted;' not in text:
              text = text.replace('class MemoriesGridWidget extends StatelessWidget {\n  final List<MemoryItem> memories;', 'class MemoriesGridWidget extends StatelessWidget {\n  final List<MemoryItem> memories;\n  final ValueChanged<String>? onDeleted;', 1)
              text = text.replace('const MemoriesGridWidget({super.key, required this.memories});', '''const MemoriesGridWidget({
    super.key,
    required this.memories,
    this.onDeleted,
  });''', 1)
              text = text.replace('memories: entry.value,\n              ))', 'memories: entry.value,\n                onDeleted: onDeleted,\n              ))', 1)
          month_start = text.find('class _MonthSection extends StatelessWidget {')
          month_end = text.find('class _MemoryHorizontalCard extends StatefulWidget {')
          month = text[month_start:month_end]
          if 'final ValueChanged<String>? onDeleted;' not in month:
              text = text.replace('class _MonthSection extends StatelessWidget {\n  final String monthLabel;\n  final List<MemoryItem> memories;', 'class _MonthSection extends StatelessWidget {\n  final String monthLabel;\n  final List<MemoryItem> memories;\n  final ValueChanged<String>? onDeleted;', 1)
              text = text.replace('const _MonthSection({required this.monthLabel, required this.memories});', '''const _MonthSection({
    required this.monthLabel,
    required this.memories,
    this.onDeleted,
  });''', 1)
              text = text.replace('child: _MemoryHorizontalCard(memory: memory),', 'child: _MemoryHorizontalCard(memory: memory, onDeleted: onDeleted),', 1)
          card_start = text.find('class _MemoryHorizontalCard extends StatefulWidget {')
          card_end = text.find('class _MemoryHorizontalCardState extends State<_MemoryHorizontalCard> {')
          card = text[card_start:card_end]
          if 'final ValueChanged<String>? onDeleted;' not in card:
              text = text.replace('class _MemoryHorizontalCard extends StatefulWidget {\n  final MemoryItem memory;', 'class _MemoryHorizontalCard extends StatefulWidget {\n  final MemoryItem memory;\n  final ValueChanged<String>? onDeleted;', 1)
              text = text.replace('const _MemoryHorizontalCard({required this.memory});', '''const _MemoryHorizontalCard({
    required this.memory,
    this.onDeleted,
  });''', 1)
          old_tap = "onTap: () => context.push('/memory-detail-screen', extra: memory),"
          new_tap = '''onTap: () async {
        final deleted = await context.push<bool>(
          '/memory-detail-screen',
          extra: memory,
        );
        if (deleted == true) {
          widget.onDeleted?.call(memory.id);
        }
      },'''
          if old_tap in text: text = text.replace(old_tap, new_tap, 1)
          elif 'widget.onDeleted?.call(memory.id);' not in text: raise SystemExit('Memory card navigation not found')
          p.write_text(text)

          p = Path('lib/presentation/circle_detail_screen/circle_detail_screen.dart')
          text = p.read_text()
          old_title = """title: memory.caption?.isNotEmpty == true
                  ? memory.caption!
                  : 'A shared memory',"""
          if old_title in text: text = text.replace(old_title, 'title: memoryDisplayTitle(memory.caption),', 1)
          elif 'title: memoryDisplayTitle(memory.caption),' not in text: raise SystemExit('Circle Detail title mapping not found')
          old_open = '''    if (deleted == true && mounted) {
      await _load();
    }'''
          new_open = '''    if (deleted == true && mounted) {
      setState(() {
        _memories = _memories.where((item) => item.id != memory.id).toList();
      });
      await _load();
    }'''
          if old_open in text: text = text.replace(old_open, new_open, 1)
          elif '_memories = _memories.where((item) => item.id != memory.id)' not in text: raise SystemExit('Circle Detail delete handler not found')
          p.write_text(text)
          PY
          git diff --check

      - name: Persist focused app fix and restore build workflow
        shell: bash
        run: |
          set -euo pipefail
          git show HEAD^:.github/workflows/build-apk.yml > .github/workflows/build-apk.yml
          rm -f .github/workflows/fix-memory-state-and-title.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/presentation/memories_screen/memories_screen.dart lib/presentation/memories_screen/widgets/memories_grid_widget.dart lib/presentation/circle_detail_screen/circle_detail_screen.dart .github/workflows/build-apk.yml .github/workflows/fix-memory-state-and-title.yml
          git diff --cached --quiet || git commit -m "Fix deleted memory state and titles"
          git push

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      # flutter_launcher_icons expects a raster image_path. Render the
      # canonical SVG logo to PNG inside CI before generating launcher icons.
      - name: Install SVG renderer
        run: sudo apt-get update && sudo apt-get install -y librsvg2-bin

      - name: Render canonical Sprout logo to PNG
        run: rsvg-convert -w 1024 -h 1024 assets/images/sprout_logo.svg -o assets/images/sprout_logo.png

      - name: Generate launcher icons
        run: dart run flutter_launcher_icons

      # env.json is git-ignored. Recreate it at build time from GitHub secrets.
      - name: Write env.json from secrets
        run: |
          cat > env.json <<'EOF'
          {"SUPABASE_URL":"${{ secrets.SUPABASE_URL }}","SUPABASE_ANON_KEY":"${{ secrets.SUPABASE_ANON_KEY }}"}
          EOF

      # Reconstruct the Android upload keystore only when the real upload key is configured.
      - name: Reconstruct upload keystore
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build release APK
        run: flutter build apk --release --dart-define-from-file=env.json
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sprout-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      # Build the Play Store AAB when the real upload key is configured.
      - name: Build release AAB
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: flutter build appbundle --release --dart-define-from-file=env.json
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload AAB
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: sprout-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14
