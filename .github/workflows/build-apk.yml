name: Build APK

# Runs automatically on every push to main, and can also be triggered
# manually from the Actions tab (workflow_dispatch) — e.g. for a rebuild
# without pushing a new commit.
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      # env.json holds SUPABASE_URL / SUPABASE_ANON_KEY. It's git-ignored
      # (never committed), so we recreate it here at build time from
      # GitHub Actions secrets. Set these once in:
      # Repo → Settings → Secrets and variables → Actions → New repository secret
      - name: Write env.json from secrets
        run: |
          echo '{"SUPABASE_URL":"${{ secrets.SUPABASE_URL }}","SUPABASE_ANON_KEY":"${{ secrets.SUPABASE_ANON_KEY }}"}' > env.json

      - name: Build release APK
        run: flutter build apk --release --dart-define-from-file=env.json

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sprout-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14
