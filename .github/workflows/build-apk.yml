name: Build APK

# Runs automatically on every push to main, and can also be triggered
# manually from the Actions tab (workflow_dispatch) — e.g. for a rebuild
# without pushing a new commit.
# Discover public-memory fixes are now included on main.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
    steps:
      - name: Check out the repo
        uses: actions/checkout@v4

      - name: Apply memory deletion source fix
        run: |
          python3 - <<'PY'
            from pathlib import Path

            detail = Path('lib/presentation/memory_detail_screen/memory_detail_screen.dart')
            text = detail.read_text()
            import_marker = "import '../../services/comments_repository.dart';\n"
            if "import '../../services/memories_repository.dart';" not in text:
              if import_marker not in text:
                raise SystemExit('Expected detail import marker not found')
              text = text.replace(
                import_marker,
                import_marker + "import '../../services/memories_repository.dart';\n",
                1,
              )

            old_delete = '''  void _showDeleteConfirm(BuildContext context) {
    showDialog(
      context: context,
      builder: (_) => _DeleteConfirmDialog(
        onConfirm: () {
          Navigator.pop(context);
          Navigator.pop(context);
        },
      ),
    );
  }
'''
            new_delete = '''  void _showDeleteConfirm(BuildContext context) {
    showDialog(
      context: context,
      builder: (_) => _DeleteConfirmDialog(
        onConfirm: () {
          Navigator.pop(context);
          _deleteMemory();
        },
      ),
    );
  }

  Future<void> _deleteMemory() async {
    try {
      await MemoriesRepository.deleteMemory(widget.memory.id);
      if (!mounted) return;
      Navigator.pop(context, true);
    } catch (e, st) {
      debugPrint('MemoryDetailScreen: delete failed: $e\\n$st');
      if (!mounted) return;
      _showSnack("Couldn't delete this memory. Please try again.");
    }
  }
'''
            if old_delete in text:
              text = text.replace(old_delete, new_delete, 1)
            elif '_deleteMemory()' not in text:
              raise SystemExit('Expected detail delete handler marker not found')
            detail.write_text(text)

            discover = Path('lib/presentation/discover_screen/discover_screen.dart')
            text = discover.read_text()
            old_open = '''  void _openMemory(Memory memory) {
    final item = MemoryItem(
'''
            new_open = '''  Future<void> _openMemory(Memory memory) async {
    final item = MemoryItem(
'''
            if old_open in text:
              text = text.replace(old_open, new_open, 1)
            elif 'Future<void> _openMemory(Memory memory) async' not in text:
              raise SystemExit('Expected Discover open handler marker not found')
            old_push = '''    context.push(AppRoutes.memoryDetailScreen, extra: item);
  }
'''
            new_push = '''    final deleted = await context.push<bool>(
      AppRoutes.memoryDetailScreen,
      extra: item,
    );
    if (deleted == true && mounted) {
      await _load();
    }
  }
'''
            if old_push in text:
              text = text.replace(old_push, new_push, 1)
            elif 'final deleted = await context.push<bool>(' not in text:
              raise SystemExit('Expected Discover push marker not found')
            discover.write_text(text)

            circle = Path('lib/presentation/circle_detail_screen/circle_detail_screen.dart')
            text = circle.read_text()
            old_circle = '''  void _openMemory(MemoryItem memory) {
    context.push(AppRoutes.memoryDetailScreen, extra: memory);
  }
'''
            new_circle = '''  Future<void> _openMemory(MemoryItem memory) async {
    final deleted = await context.push<bool>(
      AppRoutes.memoryDetailScreen,
      extra: memory,
    );
    if (deleted == true && mounted) {
      await _load();
    }
  }
'''
            if old_circle in text:
              text = text.replace(old_circle, new_circle, 1)
            elif 'Future<void> _openMemory(MemoryItem memory) async' not in text:
              raise SystemExit('Expected Circle open handler marker not found')
            circle.write_text(text)
            PY

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/presentation/memory_detail_screen/memory_detail_screen.dart lib/presentation/discover_screen/discover_screen.dart lib/presentation/circle_detail_screen/circle_detail_screen.dart
          if ! git diff --cached --quiet; then
            git commit -m "Fix memory deletion for public and circle memories"
            git push origin HEAD:main
          else
            echo "Memory deletion source fix already applied."
          fi

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable

      - name: Install dependencies
        run: flutter pub get

      # env.json holds SUPABASE_URL / SUPABASE_ANON_KEY. It's git-ignored
      # (never committed), so we recreate it here at build time from
      # GitHub Actions secrets. Set these once in:
      # Repo → Settings → Secrets and variables → Actions → New repository secret
      - name: Write env.json from secrets
        run: |
          echo '{"SUPABASE_URL":"${{ secrets.SUPABASE_URL }}","SUPABASE_ANON_KEY":"${{ secrets.SUPABASE_ANON_KEY }}"}' > env.json

      # Release signing (upload key). Only present once the repo secrets
      # below are set — see the PR/commit that introduced this step for
      # the exact secret names. Until then this step is skipped and the
      # APK build further down falls back to debug signing (fine for
      # device-testing builds, NOT for anything uploaded to Play).
      #
      # Required repo secrets (Settings → Secrets and variables → Actions):
      #   ANDROID_KEYSTORE_BASE64   base64 of the upload keystore .jks
      #   ANDROID_KEYSTORE_PASSWORD
      #   ANDROID_KEY_ALIAS
      #   ANDROID_KEY_PASSWORD
      - name: Reconstruct upload keystore from secret
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload-keystore.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload-keystore.jks" >> "$GITHUB_ENV"
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Build release APK
        run: flutter build apk --release --dart-define-from-file=env.json
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sprout-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 14

      # AAB is what actually gets uploaded to Play. Only build/upload it
      # once real upload-key signing is configured — an unsigned/debug-signed
      # AAB isn't useful as a Play artifact and would be misleading to publish.
      - name: Build release AAB
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        run: flutter build appbundle --release --dart-define-from-file=env.json
        env:
          ANDROID_KEYSTORE_PATH: ${{ env.ANDROID_KEYSTORE_PATH }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

      - name: Upload AAB
        if: ${{ env.ANDROID_KEYSTORE_BASE64 != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: sprout-aab
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 14
