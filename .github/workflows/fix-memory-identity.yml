name: Fix memory identity and title mapping

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/fix-memory-identity.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Apply targeted memory fixes
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'target not found in {path}: {old!r}')
              if text.count(old) != 1:
                  raise SystemExit(f'target occurs {text.count(old)} times in {path}: {old!r}')
              p.write_text(text.replace(old, new, 1))

          replace_once(
              'lib/presentation/memories_screen/memories_screen.dart',
              "title: memoryDisplayTitle(m.caption),",
              "title: m.title,",
          )
          replace_once(
              'lib/presentation/circle_detail_screen/circle_detail_screen.dart',
              "title: memoryDisplayTitle(memory.caption),",
              "title: memory.title,",
          )
          replace_once(
              'lib/presentation/home_screen/widgets/home_recent_memories_widget.dart',
              "title: memoryDisplayTitle(m.caption),",
              "title: m.title,",
          )
          replace_once(
              'lib/presentation/memories_screen/widgets/memories_grid_widget.dart',
              "child: _MemoryHorizontalCard(\n              memory: memory,",
              "child: _MemoryHorizontalCard(\n              key: ValueKey(memory.id),\n              memory: memory,",
          )
          replace_once(
              'lib/presentation/circle_detail_screen/circle_detail_screen.dart',
              "child: _MemoryRow(\n                        memory: memory,",
              "child: _MemoryRow(\n                        key: ValueKey(memory.id),\n                        memory: memory,",
          )
          replace_once(
              'lib/presentation/home_screen/widgets/home_recent_memories_widget.dart',
              "child: _MemoryCardWidget(\n                      memory: _memories[index],",
              "child: _MemoryCardWidget(\n                      key: ValueKey(_memories[index].id),\n                      memory: _memories[index],",
          )
          replace_once(
              'lib/presentation/memory_detail_screen/memory_detail_screen_v3.dart',
              "  String _title(Memory memory) {\n    final value = (memory.caption ?? '').split(' — ').first.trim();\n    return value.isEmpty ? 'A shared memory' : value;\n  }\n\n  String _story(Memory memory) {\n    final parts = (memory.caption ?? '').split(' — ');\n    return parts.length > 1 ? parts.sublist(1).join(' — ').trim() : '';\n  }",
              "  String _title(Memory memory) {\n    final value = memory.title.trim();\n    return value.isEmpty ? 'A shared memory' : value;\n  }\n\n  String _story(Memory memory) {\n    return (memory.caption ?? '').trim();\n  }",
          )
          PY

      - name: Validate targeted fixes
        shell: bash
        run: |
          grep -q "title: m.title" lib/presentation/memories_screen/memories_screen.dart
          grep -q "title: memory.title" lib/presentation/circle_detail_screen/circle_detail_screen.dart
          grep -q "key: ValueKey(memory.id)" lib/presentation/memories_screen/widgets/memories_grid_widget.dart
          grep -q "key: ValueKey(memory.id)" lib/presentation/circle_detail_screen/circle_detail_screen.dart
          grep -q "key: ValueKey(_memories\[index\].id)" lib/presentation/home_screen/widgets/home_recent_memories_widget.dart
          grep -q "final value = memory.title.trim()" lib/presentation/memory_detail_screen/memory_detail_screen_v3.dart

      - name: Commit fixes and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/models/memory.dart lib/services/memories_repository.dart lib/services/memory_edit_repository.dart lib/presentation/memories_screen/memories_screen.dart lib/presentation/memories_screen/widgets/memories_grid_widget.dart lib/presentation/circle_detail_screen/circle_detail_screen.dart lib/presentation/home_screen/widgets/home_recent_memories_widget.dart lib/presentation/memory_detail_screen/memory_detail_screen_v3.dart supabase/migrations/0015_memory_title_and_owner_delete_visibility.sql
          git diff --cached --quiet || git commit -m "Fix memory identity, titles, and deletion visibility"
          git rm .github/workflows/fix-memory-identity.yml
          git commit -m "Remove one-time memory identity workflow"
          git push
