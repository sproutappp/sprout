name: Fix memory carousel call site

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Fix memory carousel call site') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fix MemoryHero callback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          path = Path('lib/presentation/memory_detail_screen/memory_detail_screen_v3.dart')
          text = path.read_text()
          old = '                onTap: () => _openPhotoViewer(0),\n'
          new = '                onPhotoTap: (index) => _openPhotoViewer(index),\n'
          if old not in text:
              raise SystemExit('Expected MemoryHero callback was not found; refusing to modify anything.')
          if text.count(old) != 1:
              raise SystemExit('Expected exactly one MemoryHero callback occurrence.')
          path.write_text(text.replace(old, new, 1))
          PY
          git diff --check

      - name: Commit fix and remove one-time workflow
        run: |
          rm -f .github/workflows/fix-memory-carousel-callsite.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/presentation/memory_detail_screen/memory_detail_screen_v3.dart .github/workflows/fix-memory-carousel-callsite.yml
          git commit -m "Fix memory carousel call site"
          git push origin main
