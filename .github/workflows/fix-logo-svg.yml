name: Fix Sprout Logo SVG

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace incorrect SVG with exact Sprout logo image
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import base64
          from pathlib import Path

          png = Path('assets/images/logosprout-1787939643364.png').read_bytes()
          encoded = base64.b64encode(png).decode('ascii')
          svg = f'''<?xml version="1.0" encoding="UTF-8"?>
          <svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1536" viewBox="0 0 1024 1536">
            <title>Sprout app logo</title>
            <image width="1024" height="1536" href="data:image/png;base64,{encoded}" />
          </svg>
          '''
          Path('assets/images/img_app_logo.svg').write_text(svg, encoding='utf-8')
          PY

      - name: Commit logo fix and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          rm -f .github/workflows/fix-logo-svg.yml
          git add assets/images/img_app_logo.svg .github/workflows/fix-logo-svg.yml
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Replace incorrect app logo SVG with exact Sprout logo"
          git push
