name: Trigger APK build after memory fixes

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/trigger-memory-build.yml'

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Remove trigger workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/trigger-memory-build.yml
          git commit -m "Remove temporary APK build trigger"
          git push
