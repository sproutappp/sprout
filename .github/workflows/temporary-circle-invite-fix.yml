name: Temporary Circle Invite Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Patch circle invite behavior
        shell: python
        run: |
          from pathlib import Path

          menu = Path('lib/widgets/circle_action_menu.dart')
          text = menu.read_text()
          text = text.replace('class _CircleInvitePicker extends StatefulWidget {', 'class CircleInvitePicker extends StatefulWidget {')
          text = text.replace('const _CircleInvitePicker({required this.circle});', 'const CircleInvitePicker({required this.circle});')
          text = text.replace('State<_CircleInvitePicker> createState() => _CircleInvitePickerState();', 'State<CircleInvitePicker> createState() => _CircleInvitePickerState();')
          menu.write_text(text)

          detail = Path('lib/presentation/circle_detail_screen/circle_detail_screen.dart')
          text = detail.read_text()

          if "package:share_plus/share_plus.dart" not in text:
              text = text.replace(
                  "import 'package:google_fonts/google_fonts.dart';",
                  "import 'package:google_fonts/google_fonts.dart';\nimport 'package:share_plus/share_plus.dart';",
                  1,
              )

          if "../../widgets/circle_action_menu.dart" not in text:
              text = text.replace(
                  "import '../../theme/app_theme.dart';",
                  "import '../../theme/app_theme.dart';\nimport '../../widgets/circle_action_menu.dart';",
                  1,
              )

          old_invite = '''  void _openInviteSheet(Circle circle) {
    showModalBottomSheet<void>(
      context: context,
      isScrollControlled: true,
      backgroundColor: Colors.transparent,
      builder: (_) => _InviteSheet(circle: circle),
    );
  }
'''
          new_invite = '''  void _openInviteSheet(Circle circle) {
    showModalBottomSheet<void>(
      context: context,
      isScrollControlled: true,
      backgroundColor: Colors.transparent,
      builder: (_) => CircleInvitePicker(circle: circle),
    );
  }

  Future<void> _shareCircle(Circle circle) async {
    try {
      final token = await CirclesRepository.createInvite(circle.id);
      final link = 'https://sproutapp.in/join/$token';
      await Share.share('Join my ${circle.name} circle on Sprout:\\n$link');
    } catch (e, st) {
      debugPrint('CircleDetailScreen: share circle failed: $e\\n$st');
      if (!mounted) return;
      ScaffoldMessenger.of(context).showSnackBar(
        const SnackBar(content: Text("Couldn't create the invite link.")),
      );
    }
  }
'''
          if old_invite not in text:
              raise SystemExit('Expected _openInviteSheet block not found')
          text = text.replace(old_invite, new_invite, 1)

          text = text.replace('onInvite: () => _openInviteSheet(circle),', 'onInvite: () => _shareCircle(circle),', 1)

          start = text.find('class _InviteSheet extends StatefulWidget {')
          end = text.find('class _SheetContainer extends StatelessWidget {', start)
          if start == -1 or end == -1:
              raise SystemExit('Expected _InviteSheet block not found')
          text = text[:start] + text[end:]

          detail.write_text(text)
      - name: Commit and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/widgets/circle_action_menu.dart lib/presentation/circle_detail_screen/circle_detail_screen.dart
          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi
          git commit -m "Make circle invite and share behavior uniform"
          git push origin HEAD:main

# Trigger after the workflow has been installed on main.
