name: Fix circle menu build

on:
  push:
    paths:
      - '.github/workflows/fix-circle-build.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply fixes
        shell: python
        run: |
          from pathlib import Path

          p = Path('lib/widgets/circle_action_menu.dart')
          s = p.read_text()
          s = s.replace(
              "Positioned(right: 10, bottom: 10, child: Container(padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 7), decoration: BoxDecoration(color: Colors.black.withAlpha(170), borderRadius: BorderRadius.circular(10)), child: Text('Change', style: GoogleFonts.manrope(fontSize: 11, fontWeight: FontWeight.w700, color: Colors.white))),",
              "Positioned(right: 10, bottom: 10, child: Container(padding: const EdgeInsets.symmetric(horizontal: 10, vertical: 7), decoration: BoxDecoration(color: Colors.black.withAlpha(170), borderRadius: BorderRadius.circular(10)), child: Text('Change', style: GoogleFonts.manrope(fontSize: 11, fontWeight: FontWeight.w700, color: Colors.white)))),",
          )
          s = s.replace(
              "return Padding(padding: const EdgeInsets.only(bottom: 8), child: GestureDetector(onTap: onTap, child: Container(width: double.infinity, padding: const EdgeInsets.symmetric(horizontal: 16, vertical: 14), decoration: BoxDecoration(color: AppTheme.surfaceVariantDark, borderRadius: BorderRadius.circular(14), border: Border.all(color: AppTheme.outline, width: 0.6)), child: Row(children: [Icon(icon, size: 20, color: color), const SizedBox(width: 12), Text(label, style: GoogleFonts.manrope(fontSize: 14, fontWeight: FontWeight.w700, color: color))])));",
              "return Padding(padding: const EdgeInsets.only(bottom: 8), child: GestureDetector(onTap: onTap, child: Container(width: double.infinity, padding: const EdgeInsets.symmetric(horizontal: 16, vertical: 14), decoration: BoxDecoration(color: AppTheme.surfaceVariantDark, borderRadius: BorderRadius.circular(14), border: Border.all(color: AppTheme.outline, width: 0.6)), child: Row(children: [Icon(icon, size: 20, color: color), const SizedBox(width: 12), Text(label, style: GoogleFonts.manrope(fontSize: 14, fontWeight: FontWeight.w700, color: color))]))));",
          )
          p.write_text(s)

          p = Path('lib/services/profiles_repository.dart')
          s = p.read_text()
          marker = "  /// Updates the current user's editable profile fields"
          method = """  static Future<List<Profile>> fetchAllUsers() async {\n    final rows = await _client\n        .from('profiles')\n        .select()\n        .order('full_name', ascending: true);\n    return (rows as List)\n        .map((row) => Profile.fromMap(Map<String, dynamic>.from(row)))\n        .toList();\n  }\n\n"""
          if 'static Future<List<Profile>> fetchAllUsers()' not in s:
              s = s.replace(marker, method + marker)
          p.write_text(s)

          p = Path('lib/presentation/profile_screen/profile_screen.dart')
          s = p.read_text()
          s = s.replace(
              "child: _CircleRowItem(circle: c),",
              "child: _CircleRowItem(circle: c, onChanged: _load),",
          )
          s = s.replace(
              "class _CircleRowItem extends StatelessWidget {\n  final _CircleRow circle;\n\n  const _CircleRowItem({required this.circle});",
              "class _CircleRowItem extends StatelessWidget {\n  final _CircleRow circle;\n  final VoidCallback? onChanged;\n\n  const _CircleRowItem({required this.circle, this.onChanged});",
          )
          s = s.replace("onChanged: _load,", "onChanged: onChanged,", 1)
          p.write_text(s)

          p = Path('lib/presentation/home_screen/widgets/home_circles_strip_widget.dart')
          s = p.read_text()
          s = s.replace(
              "child: _CircleRowItem(circle: circle),",
              "child: _CircleRowItem(circle: circle, onChanged: _load),",
          )
          s = s.replace(
              "class _CircleRowItem extends StatefulWidget {\n  final _CircleModel circle;\n  const _CircleRowItem({required this.circle});",
              "class _CircleRowItem extends StatefulWidget {\n  final _CircleModel circle;\n  final VoidCallback? onChanged;\n  const _CircleRowItem({required this.circle, this.onChanged});",
          )
          s = s.replace(
              "CircleActionMenu(\n              circle: c.sourceCircle,\n              onChanged: _load,\n            ),",
              "CircleActionMenu(\n              circle: c.sourceCircle,\n              onChanged: widget.onChanged,\n            ),",
          )
          p.write_text(s)

          # Remove this one-time workflow after applying the source changes.
          wf = Path('.github/workflows/fix-circle-build.yml')
          subprocess = __import__('subprocess')
          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', 'lib/widgets/circle_action_menu.dart', 'lib/services/profiles_repository.dart', 'lib/presentation/profile_screen/profile_screen.dart', 'lib/presentation/home_screen/widgets/home_circles_strip_widget.dart'], check=True)
          subprocess.run(['git', 'commit', '-m', 'Fix circle menu compilation'], check=True)
          subprocess.run(['git', 'push'], check=True)
          wf.unlink()
          subprocess.run(['git', 'add', str(wf)], check=True)
          subprocess.run(['git', 'commit', '-m', 'Remove one-time circle build fix workflow'], check=True)
          subprocess.run(['git', 'push'], check=True)
