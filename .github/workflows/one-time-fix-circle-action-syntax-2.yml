name: One-time fix circle action syntax

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fix malformed invite button closing parentheses
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          path = Path('lib/widgets/circle_action_menu.dart')
          text = path.read_text()
          lines = text.splitlines(keepends=True)
          changed = False
          for i, line in enumerate(lines):
              if 'SizedBox(width: double.infinity, child: ElevatedButton' in line and 'Send Invite' in line:
                  fixed = re.sub(r'\)+,(\s*)$', '))),\\1', line)
                  if fixed != line:
                      lines[i] = fixed
                      changed = True
          if not changed:
              print('Circle action syntax is already fixed.')
              raise SystemExit(0)
          path.write_text(''.join(lines))
          PY

      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/widgets/circle_action_menu.dart
          git rm .github/workflows/one-time-fix-circle-action-syntax-2.yml
          git commit -m "Fix circle action menu syntax"
          git push
