name: One-time Circle Menu Owner Visibility Fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: github.event.head_commit.message != 'Hide edit circle from members'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Hide Edit Circle from members
        shell: python
        run: |
          from pathlib import Path
          path = Path('lib/presentation/circle_detail_screen/circle_detail_screen.dart')
          text = path.read_text()

          old = """          _MenuOption(\n            icon: Icons.edit_rounded,\n            label: 'Edit Circle',\n            color: AppTheme.textPrimary,\n            onTap: () => Navigator.pop(context, 'edit'),\n          ),\n"""
          new = """          if (isOwner)\n            _MenuOption(\n              icon: Icons.edit_rounded,\n              label: 'Edit Circle',\n              color: AppTheme.textPrimary,\n              onTap: () => Navigator.pop(context, 'edit'),\n            ),\n"""
          assert old in text, 'Edit Circle menu block not found'
          text = text.replace(old, new, 1)
          path.write_text(text)

      - name: Verify
        run: |
          grep -q "if (isOwner)" lib/presentation/circle_detail_screen/circle_detail_screen.dart
          grep -q "label: isOwner ? 'Delete Circle' : 'Leave Circle'" lib/presentation/circle_detail_screen/circle_detail_screen.dart

      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add lib/presentation/circle_detail_screen/circle_detail_screen.dart
          git rm .github/workflows/one-time-circle-menu-owner-visibility.yml
          git commit -m "Hide edit circle from members"
          git push