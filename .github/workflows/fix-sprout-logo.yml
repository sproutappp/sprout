name: Fix Sprout Logo

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  fix-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace logo assets
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image
          import base64

          source = Path('assets/images/logosprout-1787939643364.png')
          assert source.is_file(), f'Missing source logo: {source}'
          image = Image.open(source).convert('RGBA')

          # Remove only fully transparent outer padding, preserving the logo artwork.
          alpha = image.getchannel('A')
          bbox = alpha.getbbox()
          if bbox:
              image = image.crop(bbox)

          sizes = {
              'mipmap-mdpi': 48,
              'mipmap-hdpi': 72,
              'mipmap-xhdpi': 96,
              'mipmap-xxhdpi': 144,
              'mipmap-xxxhdpi': 192,
          }
          for folder, size in sizes.items():
              out_dir = Path('android/app/src/main/res') / folder
              out_dir.mkdir(parents=True, exist_ok=True)
              icon = image.copy()
              icon.thumbnail((size, size), Image.Resampling.LANCZOS)
              canvas = Image.new('RGBA', (size, size), (0, 0, 0, 0))
              x = (size - icon.width) // 2
              y = (size - icon.height) // 2
              canvas.alpha_composite(icon, (x, y))
              canvas.save(out_dir / 'ic_launcher.png', 'PNG', optimize=True)

          encoded = base64.b64encode(source.read_bytes()).decode('ascii')
          Path('assets/images/img_app_logo.svg').write_text(
              '<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1536">'
              f'<image width="1024" height="1536" href="data:image/png;base64,{encoded}" '
              'preserveAspectRatio="xMidYMid meet"/></svg>\n',
              encoding='utf-8',
          )
          PY

      - name: Commit logo changes
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/img_app_logo.svg android/app/src/main/res/mipmap-*/ic_launcher.png
          if git diff --cached --quiet; then
            echo "No logo changes needed"
            exit 0
          fi
          git commit -m "Use exact Sprout logo for app icons"
          git push

      - name: Trigger fresh Android build
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run build-apk.yml --ref main

      - name: Remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          git pull --rebase origin main
          git rm .github/workflows/fix-sprout-logo.yml
          git commit -m "Remove one-time logo fix workflow"
          git push
