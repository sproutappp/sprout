name: Fix Discover refresh

on:
  push:
    paths:
      - '.github/workflows/fix-discover-refresh.yml'

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply Discover refresh fix
        shell: python
        run: |
          from pathlib import Path
          import subprocess

          p = Path('lib/presentation/discover_screen/discover_screen.dart')
          s = p.read_text()
          s = s.replace(
              "import '../../services/memories_repository.dart';",
              "import '../../services/memories_repository.dart';\nimport '../../services/discover_refresh_bus.dart';",
          )
          s = s.replace(
              "  @override\n  void initState() {\n    super.initState();\n    _load();\n  }",
              "  @override\n  void initState() {\n    super.initState();\n    DiscoverRefreshBus.signal.addListener(_onRefreshRequested);\n    _load();\n  }\n\n  @override\n  void dispose() {\n    DiscoverRefreshBus.signal.removeListener(_onRefreshRequested);\n    super.dispose();\n  }\n\n  void _onRefreshRequested() {\n    if (mounted) _load();\n  }",
          )
          p.write_text(s)

          p = Path('lib/widgets/app_navigation.dart')
          s = p.read_text()
          s = s.replace(
              "import '../theme/app_theme.dart';",
              "import '../theme/app_theme.dart';\nimport '../services/discover_refresh_bus.dart';",
          )
          s = s.replace(
              "    widget.navigationShell.goBranch(\n      tab.branchIndex!,\n      initialLocation: tab.branchIndex == widget.navigationShell.currentIndex,\n    );",
              "    widget.navigationShell.goBranch(\n      tab.branchIndex!,\n      initialLocation: tab.branchIndex == widget.navigationShell.currentIndex,\n    );\n\n    if (tab.branchIndex == 2) {\n      DiscoverRefreshBus.requestRefresh();\n    }",
          )
          p.write_text(s)

          subprocess.run(['git', 'config', 'user.name', 'github-actions[bot]'], check=True)
          subprocess.run(['git', 'config', 'user.email', '41898282+github-actions[bot]@users.noreply.github.com'], check=True)
          subprocess.run(['git', 'add', 'lib/presentation/discover_screen/discover_screen.dart', 'lib/widgets/app_navigation.dart', 'lib/services/discover_refresh_bus.dart'], check=True)
          subprocess.run(['git', 'commit', '-m', 'Refresh Discover when opened'], check=True)
          subprocess.run(['git', 'push'], check=True)

          wf = Path('.github/workflows/fix-discover-refresh.yml')
          wf.unlink()
          subprocess.run(['git', 'add', str(wf)], check=True)
          subprocess.run(['git', 'commit', '-m', 'Remove one-time Discover refresh workflow'], check=True)
          subprocess.run(['git', 'push'], check=True)
